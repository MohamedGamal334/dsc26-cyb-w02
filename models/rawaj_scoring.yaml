zones:
  - id: public
    trust: 0
  - id: perimeter
    trust: 1
  - id: internal
    trust: 2
  - id: secure
    trust: 3
  - id: vault
    trust: 4

elements:
  - id: user
    kind: external_entity
    zone: public
  - id: analyst
    kind: external_entity
    zone: perimeter
  - id: api_gateway
    kind: process
    zone: perimeter
  - id: scoring_engine
    kind: process
    zone: internal
  - id: profile_db
    kind: data_store
    zone: secure
    holds_pii: true
  - id: case_db
    kind: data_store
    zone: secure
  - id: audit_log
    kind: data_store
    zone: vault
    is_log: true
  - id: external_bureau
    kind: external_entity
    zone: public
  - id: notification_service
    kind: process
    zone: internal

flows:
